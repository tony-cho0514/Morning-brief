name: Send Morning Brief

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance feedparser openai schedule

      - name: Send newsletter
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: jogisang594@gmail.com
          SENDER_NAME: 오늘의 시장 브리핑
          REPLY_TO: jogisang594@gmail.com
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USERNAME: jogisang594@gmail.com
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_INTEGRATIONS_OPENAI_BASE_URL: https://api.openai.com/v1
          AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd ${{ github.workspace }}/newsletter
          python -c "import sys; sys.path.insert(0, '.'); exec(open('send_newsletter.py').read())"
